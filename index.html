<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hair Room by Lindsay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Dancing+Script:wght@600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f5ede0;
      --light: #faf6f0;
      --warm:  #ece0d0;
      --gold:  #9e7d3a;
      --dark:  #1e1a16;
      --muted: #7a6a58;
      --border:#ddd0bb;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--light);
      color: var(--dark);
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

    /* Logo-afbeelding */
    .logo-full{
      background-image:url('logo-full.png');
      background-repeat:no-repeat;
      background-position:center;
      background-size:contain;
      display:inline-block;
    }
    .logo-full-nav{
      width:140px;
      height:calc(140px * 0.6);
    }
    .logo-full-footer{
      width:150px;
      height:calc(150px * 0.6);
      margin-bottom:1.1rem;
    }
    /* Groot logo in hero – zelfde achtergrond als banner,
       zodat het lijkt of het 'erin' zit */
    .logo-full-hero{
      width:min(520px, 90vw);
      height:calc(min(520px, 90vw) * 0.6);
      background-color:#f5ede0; /* zachte crème zoals in je voorbeeld */
      border-radius:8px;
      box-shadow:0 18px 40px rgba(0,0,0,.06);
      margin-bottom:2.2rem;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 4rem;
      background: rgba(250,246,240,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      transition: padding .3s;
    }
    .nav-logo {
      text-decoration: none; line-height: 1;
    }
    .nav-logo .nl-top {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; font-weight: 600; letter-spacing: .32em;
      text-transform: uppercase; color: var(--gold); display: block;
    }
    .nav-logo .nl-script {
      font-family: 'Dancing Script', cursive;
      font-size: 1.25rem; color: var(--gold); margin-left: .4rem;
    }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-size: .73rem; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; transition: color .2s;
    }
    .nav-links a:hover { color: var(--gold); }
    .nav-cta {
      padding: .55rem 1.5rem; background: var(--gold);
      color: var(--light) !important; transition: background .2s !important;
      border-radius: 999px;
    }
    .nav-cta:hover { background: var(--dark) !important; }
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; background: none; border: none;
    }
    .hamburger span {
      display: block; width: 22px; height: 1.5px; background: var(--dark);
    }

    /* HERO – volle breedte, clean */
    #home {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 110px 4rem 4rem;
      background: linear-gradient(135deg,#faf6f0 0%,#f2e7d6 50%,#e2cfb0 100%);
    }
    .hero-inner {
      max-width: 720px;
      text-align:center;
    }
    .hero-eyebrow {
      font-size: .68rem; letter-spacing: .26em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 1.6rem;
    }
    .hero-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; font-style: italic;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.8;
      margin:0 auto 2.3rem;
    }
    .hero-actions {
      display: flex; gap: 1rem; justify-content:center; flex-wrap: wrap;
    }
    .btn-main {
      padding: .85rem 2.1rem;
      border-radius: 999px;
      font-size: .7rem; letter-spacing: .18em; text-transform: uppercase;
      text-decoration: none; cursor: pointer;
    }
    .btn-main-primary {
      background: var(--gold); color: var(--light);
      border: none;
    }
    .btn-main-primary:hover { background: var(--dark); }
    .btn-main-ghost {
      border: 1px solid var(--border);
      color: var(--muted);
      background: transparent;
    }
    .btn-main-ghost:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* KORTE OVER-MIJ SECTIE OP HOMEPAGE */
    #over-kort {
      padding: 4rem 4rem 4.5rem;
      background: var(--light);
      border-top: 1px solid var(--border);
    }
    .over-mini {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 3rem;
      align-items: flex-start;
    }
    .over-mini h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 3vw, 2.6rem);
      line-height: 1.2;
      margin-bottom: 1.4rem;
      color: var(--dark);
    }
    .over-mini h2 em {
      font-style: italic; color: var(--gold);
    }
    .over-mini p {
      font-size: .95rem;
      color: var(--muted);
      line-height: 1.9;
      max-width: 480px;
    }
    .over-mini-card {
      padding: 1.8rem 1.9rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--warm);
    }
    .over-mini-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      margin-bottom: .7rem;
      color: var(--dark);
    }
    .over-mini-card p {
      font-size: .9rem;
      color: var(--muted);
      line-height: 1.7;
    }
    .over-mini-card a {
      display: inline-block;
      margin-top: .9rem;
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--gold);
      border-bottom: 1px solid rgba(158,125,58,.4);
      padding-bottom: 2px;
    }
    .over-mini-card a:hover {
      border-color: var(--gold);
    }

    /* OPENINGSTIJDEN */
    .hours-bar {
      background: var(--warm);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 2.2rem 4rem;
    }
    .hours-inner {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 800px;
      margin: 0 auto;
    }
    .hi {
      text-align: center;
      padding: .9rem 1.8rem;
      border-right: 1px solid var(--border);
    }
    .hi:last-child { border-right: none; }
    .hi-day {
      font-size: .6rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .25rem;
    }
    .hi-time {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: var(--dark);
    }
    .hi-time.closed {
      color: var(--border);
      font-style: italic;
      font-size: .85rem;
    }

    /* FOOTER */
    footer {
      background: var(--dark);
      color: rgba(255,255,255,.38);
      padding: 4rem 4rem 2rem;
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1.8fr 1fr 1fr;
      gap: 3.5rem;
      margin-bottom: 3rem;
    }
    .fb-logo {
      text-decoration: none;
      display: block;
      margin-bottom: 1.1rem;
    }
    .fb-logo .fl-top {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
    }
    .fb-logo .fl-script {
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem;
      color: var(--gold);
      margin-left: .3rem;
    }
    .fb-brand p {
      font-size: .84rem;
      line-height: 1.8;
    }
    .soc-row {
      display: flex;
      gap: .7rem;
      margin-top: 1.4rem;
    }
    .soc {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.14);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: rgba(255,255,255,.35);
      font-size: .82rem;
      transition: border-color .2s, color .2s;
    }
    .soc:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .fc h4 {
      font-size: .6rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--cream);
      margin-bottom: 1.3rem;
    }
    .fc ul {
      list-style: none;
    }
    .fc ul li {
      margin-bottom: .65rem;
      font-size: .84rem;
    }
    .fc ul a {
      color: rgba(255,255,255,.38);
      text-decoration: none;
      transition: color .2s;
    }
    .fc ul a:hover {
      color: var(--gold);
    }
    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .73rem;
    }

    /* RESPONSIVE */
    @media (max-width: 960px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links {
        display:none;
        position:absolute;
        top:100%; left:0; right:0;
        flex-direction:column;
        background:var(--light);
        padding:1.5rem 2rem;
        gap:1.2rem;
        border-bottom:1px solid var(--border);
      }
      .nav-links.open { display:flex; }
      .hamburger { display:flex; }

      #home {
        padding: 88px 2rem 3.5rem;
      }
      .hero-inner { max-width: 100%; }

      #over-kort { padding:3rem 2rem 4rem; }
      .over-mini { grid-template-columns:1fr; }

      .hours-bar { padding:2rem; }
      .hi { padding:.75rem 1.2rem; }

      footer { padding:3.2rem 2rem 2rem; }
      .footer-grid { grid-template-columns:1fr; gap:2.5rem; }
      .footer-bottom {
        flex-direction:column;
        gap:.6rem;
        align-items:flex-start;
      }
    }

    @media (max-width: 480px) {
      .hours-inner { flex-direction:column; }
      .hi { border-right:none; border-bottom:1px solid var(--border); }
      .hi:last-child { border-bottom:none; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav id="navbar">
  <a href="index.html" class="nav-logo" aria-label="Hair Room by Lindsay">
    <span class="logo-full logo-full-nav"></span>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="over.html">Over mij</a></li>
    <li><a href="prijzen.html">Prijslijst</a></li>
    <li><a href="afspraak.html" class="nav-cta">Afspraak</a></li>
  </ul>
  <button class="hamburger" onclick="toggleMenu()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- HERO -->
<section id="home">
  <div class="hero-inner">
    <p class="hero-eyebrow">HAIR ROOM BY LINDSAY · SALON &amp; AAN HUIS</p>
